name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: verify (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [24, 26]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # typecheck, tests, build, and the built CLI once
      - run: npm run verify
      # the package as npm would ship it installs and runs
      - run: npm run smoke
      # cage checks itself, with the pinned published package
      - run: npm run cage
