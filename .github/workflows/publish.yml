name: Publish

# Publishes the package to npm when a version tag is pushed:
#   npm version minor      # bumps package.json, commits, tags vX.Y.Z
#   git push --follow-tags
# Needs the NPM_TOKEN secret (an npm automation token with publish rights). Provenance ties the package to this workflow run.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: npm run smoke
      # The tag must name the version in package.json.
      - run: test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
